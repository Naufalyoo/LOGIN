<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Google / Facebook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-card">
    <h1>Masuk dengan</h1>

    <button id="googleLogin" class="btn google">Google</button>

    <p class="small">

    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
